spring.application.name=Backend Test
server.port=8081

# ================== JWT Configuration ==================
jwt.secret=giang
jwt.expiration-ms=900000
jwt.refresh-expiration-days=7
# ================== SQLite Configuration ==================
spring.datasource.url=jdbc:sqlite:Backend/database/users.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate JPA
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tùy chọn
spring.sql.init.mode=always

# Tắt banner nếu muốn sạch sẽ
spring.main.banner-mode=off

# ================== GraphQL Configuration ==================
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# ================== RabbitMQ Configuration ==================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1

# ================== File Upload Configuration ==================
# Maximum file size (default: 1MB)
spring.servlet.multipart.max-file-size=100MB
# Maximum request size (default: 10MB)
spring.servlet.multipart.max-request-size=100MB
# Enable file upload
spring.servlet.multipart.enabled=true

# ================== WebSocket Configuration ==================
# WebSocket buffer size limit (default: 64KB, increase to 10MB)
spring.websocket.buffer-size-limit=10485760
# WebSocket message size limit
spring.websocket.max-text-message-buffer-size=10485760
# WebSocket max session message buffer
spring.websocket.max-session-message-buffer-size=10485760